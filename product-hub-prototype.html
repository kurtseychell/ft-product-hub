<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Hub — Interactive Prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --indigo: #4F46E5;
    --navy: #1E1B4B;
    --sidebar: 260px;
    --bar: 52px;
  }

  body { font-family: 'Inter', system-ui, sans-serif; background: #0f0f13; color: #fff; height: 100vh; overflow: hidden; display: flex; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar);
    min-width: var(--sidebar);
    background: var(--navy);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid rgba(255,255,255,0.08);
    z-index: 10;
  }

  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  #sidebar-header .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  #sidebar-header .logo .hex {
    width: 28px; height: 28px; background: var(--indigo);
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
  }
  #sidebar-header .badge {
    margin-top: 6px;
    font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  #sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }
  #sidebar-scroll::-webkit-scrollbar { width: 4px; }
  #sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
  #sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .flow-group { margin-bottom: 2px; }
  .flow-label {
    padding: 6px 16px 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.35); text-transform: uppercase;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    user-select: none;
  }
  .flow-label:hover { color: rgba(255,255,255,0.6); }
  .flow-label .chevron { transition: transform 0.2s; font-size: 8px; }
  .flow-label.collapsed .chevron { transform: rotate(-90deg); }
  .flow-screens { overflow: hidden; transition: max-height 0.25s ease; }
  .flow-screens.collapsed { max-height: 0 !important; }

  .screen-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px 7px 20px;
    cursor: pointer; transition: background 0.15s;
    border-left: 2px solid transparent;
    font-size: 12px; color: rgba(255,255,255,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .screen-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .screen-item.active {
    background: rgba(79,70,229,0.2);
    border-left-color: var(--indigo);
    color: #fff; font-weight: 500;
  }
  .screen-item .id-badge {
    font-size: 9px; font-weight: 700; padding: 1px 5px;
    border-radius: 3px; flex-shrink: 0; letter-spacing: 0.03em;
  }
  .flow-A .id-badge { background: #2563EB22; color: #60A5FA; }
  .flow-B .id-badge { background: #7C3AED22; color: #A78BFA; }
  .flow-C .id-badge { background: #059669220; color: #34D399; }
  .flow-D .id-badge { background: #D9770622; color: #FBBF24; }
  .flow-E .id-badge { background: #DC262622; color: #F87171; }
  .flow-Z .id-badge { background: #6B728022; color: #9CA3AF; }

  /* ── MAIN AREA ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── TOP BAR ── */
  #topbar {
    height: var(--bar);
    background: #18181f;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; flex-shrink: 0; gap: 12px;
  }
  #screen-info { display: flex; align-items: center; gap: 10px; }
  #screen-badge {
    font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 4px; background: rgba(79,70,229,0.25); color: #818CF8;
  }
  #screen-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); }
  #screen-flow { font-size: 11px; color: rgba(255,255,255,0.35); }

  #topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
    font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    background: transparent; color: rgba(255,255,255,0.6);
  }
  .btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .btn-primary { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .btn-primary:hover { background: #4338CA; }

  /* ── VIEWPORT ── */
  #viewport {
    flex: 1; position: relative; overflow: hidden; background: #111118;
    display: flex; align-items: flex-start; justify-content: center;
    cursor: pointer;
  }

  #screen-img {
    width: 100%; height: 100%;
    object-fit: contain; object-position: top center;
    transition: opacity 0.25s ease;
    display: block;
  }
  #screen-img.fading { opacity: 0; }

  /* Click hotspots */
  .hotspot {
    position: absolute;
    cursor: pointer;
    background: rgba(79, 70, 229, 0.0);
    border-radius: 6px;
    transition: background 0.15s;
    z-index: 5;
  }
  .hotspot:hover {
    background: rgba(79, 70, 229, 0.18);
    outline: 2px solid rgba(79, 70, 229, 0.6);
  }
  .hotspot .tooltip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--indigo); color: #fff; font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
  }
  .hotspot:hover .tooltip { opacity: 1; }

  /* ── BOTTOM BAR ── */
  #bottombar {
    height: 44px; background: #18181f;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; flex-shrink: 0;
  }

  #flow-progress {
    display: flex; align-items: center; gap: 4px;
  }
  .progress-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.15); transition: all 0.2s; cursor: pointer;
  }
  .progress-dot.active { background: var(--indigo); width: 18px; border-radius: 3px; }
  .progress-dot.visited { background: rgba(79,70,229,0.5); }

  #nav-controls { display: flex; align-items: center; gap: 8px; }
  #nav-controls .counter { font-size: 11px; color: rgba(255,255,255,0.3); margin: 0 4px; }

  #hint {
    font-size: 11px; color: rgba(255,255,255,0.25);
    display: flex; align-items: center; gap: 5px;
  }
  #hint kbd {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    padding: 1px 5px; border-radius: 3px; font-size: 10px;
  }

  /* Transition overlay */
  #overlay {
    position: fixed; inset: 0; background: #0f0f13;
    opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity 0.2s;
  }
  #overlay.show { opacity: 1; pointer-events: all; }

  /* Zoom mode */
  #viewport.zoom-mode #screen-img {
    object-fit: none;
    width: auto; height: auto;
    min-width: 100%;
    cursor: zoom-out;
  }
  #viewport.zoom-mode { overflow: auto; align-items: flex-start; cursor: default; }
</style>
</head>

</div>

const FLOW_COLORS = { A: '#60A5FA', B: '#A78BFA', C: '#34D399', D: '#FBBF24', E: '#F87171', Z: '#9CA3AF' };
const FLOW_NAMES  = { A: 'Authentication', B: 'Submission & PRD', C: 'AI Processing', D: 'Backlog & Planning', E: 'Delivery', Z: 'Admin' };

let current = 0;
let hotspotsVisible = true;
let visited = new Set([0]);

// ── Build Sidebar ──
function buildSidebar() {
  const container = document.getElementById('sidebar-scroll');
  const flows = [...new Set(SCREENS.map(s => s.flow))];

  flows.forEach(flow => {
    const screens = SCREENS.filter(s => s.flow === flow);
    const group = document.createElement('div');
    group.className = 'flow-group';

    const label = document.createElement('div');
    label.className = `flow-label flow-${flow}`;
    label.innerHTML = `<span style="color:${FLOW_COLORS[flow]}">${flow} — ${FLOW_NAMES[flow]}</span><span class="chevron">▾</span>`;
    label.onclick = () => {
      const screensEl = group.querySelector('.flow-screens');
      screensEl.classList.toggle('collapsed');
      label.classList.toggle('collapsed');
    };

    const screensEl = document.createElement('div');
    screensEl.className = 'flow-screens';
    screensEl.style.maxHeight = screens.length * 38 + 'px';

    screens.forEach((s, i) => {
      const idx = SCREENS.indexOf(s);
      const item = document.createElement('div');
      item.className = `screen-item flow-${flow}`;
      item.id = `nav-${s.id}`;
      item.innerHTML = `<span class="id-badge">${s.id}</span><span>${s.title}</span>`;
      item.onclick = () => goTo(idx);
      screensEl.appendChild(item);
    });

    group.appendChild(label);
    group.appendChild(screensEl);
    container.appendChild(group);
  });
}

// ── Render Screen ──
function render(idx, dir = 1) {
  const s = SCREENS[idx];
  const img = document.getElementById('screen-img');

  img.classList.add('fading');
  setTimeout(() => {
    img.src = s.img;
    img.onload = () => img.classList.remove('fading');
    img.onerror = () => img.classList.remove('fading');
  }, 180);

  // Update info
  document.getElementById('screen-badge').textContent = s.id;
  document.getElementById('screen-badge').style.background = `${FLOW_COLORS[s.flow]}22`;
  document.getElementById('screen-badge').style.color = FLOW_COLORS[s.flow];
  document.getElementById('screen-title').textContent = s.title;
  document.getElementById('screen-flow').textContent = `Flow ${s.flow} — ${s.flowName}`;
  document.getElementById('counter').textContent = `${idx + 1} / ${SCREENS.length}`;

  // Hotspots
  renderHotspots(s);

  // Progress dots
  renderProgress(idx);

  // Sidebar active
  document.querySelectorAll('.screen-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.getElementById(`nav-${s.id}`);
  if (activeItem) {
    activeItem.classList.add('active');
    activeItem.scrollIntoView({ block: 'nearest' });
  }

  // Mark visited
  visited.add(idx);
  updateVisited();
}

function renderHotspots(screen) {
  const layer = document.getElementById('hotspot-layer');
  layer.innerHTML = '';
  if (!hotspotsVisible) return;

  screen.hotspots.forEach(hs => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.style.top = hs.top;
    el.style.left = hs.left;
    el.style.width = hs.width;
    el.style.height = hs.height;
    el.innerHTML = `<div class="tooltip">→ ${hs.label}</div>`;
    el.onclick = (e) => {
      e.stopPropagation();
      const targetIdx = SCREENS.findIndex(s => s.id === hs.target);
      if (targetIdx >= 0) goTo(targetIdx);
    };
    layer.appendChild(el);
  });
}

function renderProgress(idx) {
  const bar = document.getElementById('flow-progress');
  const flowScreens = SCREENS.filter(s => s.flow === SCREENS[idx].flow);
  bar.innerHTML = '';
  flowScreens.forEach(s => {
    const dot = document.createElement('div');
    const i = SCREENS.indexOf(s);
    dot.className = 'progress-dot' + (i === idx ? ' active' : '') + (visited.has(i) && i !== idx ? ' visited' : '');
    dot.onclick = () => goTo(i);
    dot.title = s.id;
    bar.appendChild(dot);
  });
}

function updateVisited() {
  SCREENS.forEach((s, i) => {
    const el = document.getElementById(`nav-${s.id}`);
    if (el && visited.has(i) && i !== current) {
      el.style.opacity = '0.7';
    }
  });
}

// ── Navigation ──
function goTo(idx) {
  if (idx < 0 || idx >= SCREENS.length) return;
  current = idx;
  render(idx);
}

function navigate(dir) {
  goTo(Math.max(0, Math.min(SCREENS.length - 1, current + dir)));
}

function handleViewportClick(e) {
  if (e.target.closest('.hotspot')) return;
  navigate(1);
}

function toggleZoom() {
  const vp = document.getElementById('viewport');
  vp.classList.toggle('zoom-mode');
  document.getElementById('zoom-btn').textContent = vp.classList.contains('zoom-mode') ? '⤡ Fit' : '⤢ Fit';
}

function toggleHotspots() {
  hotspotsVisible = !hotspotsVisible;
  document.getElementById('hs-btn').textContent = hotspotsVisible ? '◎ Hotspots' : '○ Hotspots';
  document.getElementById('hs-btn').style.opacity = hotspotsVisible ? '1' : '0.5';
  renderHotspots(SCREENS[current]);
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
  if (e.key.toLowerCase() === 'h') toggleHotspots();
  if (e.key.toLowerCase() === 'z') toggleZoom();
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End')  goTo(SCREENS.length - 1);
  // Jump to flow: press 'a','b','c','d','e','z'
  const flowKey = e.key.toUpperCase();
  if (['A','B','C','D','E','Z'].includes(flowKey)) {
    const idx = SCREENS.findIndex(s => s.flow === flowKey);
    if (idx >= 0) goTo(idx);
  }
});

// ── Init ──
buildSidebar();
render(0);
</script>
